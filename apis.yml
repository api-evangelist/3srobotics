aid: 3srobotics
name: 3S robotics
description: '3S robotics (Shanghai Shengshi Weisheng Technology Co., Ltd. / 上海昇视唯盛科技有限公司)
  is a Chinese intelligent-robotics manufacturer founded in 2020 and headquartered in the Songjiang
  district of Shanghai, with a smart factory in the Haining Economic Development Zone, Zhejiang. It is
  a member company of the listed Harbin Institute of Technology intelligent-robotics group (哈工智能),
  and its majority-held subsidiary Hagong Hyundai (哈工现代, HGXD) builds general-purpose industrial
  robots. The company develops an in-house "AI + 3D + ROBOT" stack — machine-vision cameras, motion
  control, and offline path-planning software — packaged as task-specific intelligent robots for
  welding, grinding and assembly, marketed as needing no teach-pendant programming. Its flagship line
  is a 3D-vision intelligent welding robot aimed at steel-structure, tunnel arch, rail-transit and
  heavy-equipment fabrication. The software it ships is embedded machine-side control and vision
  tooling sold with the hardware; the company publishes no public developer program, API, SDK or
  machine-readable interface contract.'
